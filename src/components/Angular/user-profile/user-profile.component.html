<ng-container *ngFor="let profile of userProfile()">
  <p>Name: {{ profile.name }}</p>
  <p>Age: {{ profile.age }}</p>
</ng-container>
<button mat-raised-button color="warn" (click)="updateProfile()">
  Update Profile
</button>
<button mat-raised-button color="warn" (click)="setProfile()">
  Set Profile
</button>
